<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance Visit Status</title>
<style>
  :root {
    --ink: #14181f;
    --ink-soft: #2a3140;
    --paper: #eef0f3;
    --paper-card: #f8f9fb;
    --line: #d7dce3;
    --amber: #c8791f;
    --amber-deep: #a5610f;
    --ok: #2f7a4f;
    --error: #b8422f;
    --mono: "IBM Plex Mono", "SF Mono", Consolas, monospace;
    --sans: "IBM Plex Sans", "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--paper);
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 28px 28px; background-position: -1px -1px;
    font-family: var(--sans); color: var(--ink);
    display: flex; justify-content: center; padding: 40px 16px 80px;
  }
  .sheet { width: 100%; max-width: 560px; }
  .hero {
    position: relative; background: linear-gradient(135deg, var(--ink) 0%, #1c2230 60%, var(--ink-soft) 100%);
    border-radius: 12px; overflow: hidden; margin-bottom: 20px; padding: 30px 26px; isolation: isolate;
  }
  .hero h1 { font-size: 26px; color: #fff; margin: 6px 0 8px; font-weight: 700; letter-spacing: -0.01em; }
  .hero .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #f0b06a; }
  .hero .eyebrow::before { content: "● "; color: var(--amber); }
  .hero p.sub { font-size: 14px; color: #b7bdc9; margin: 0; line-height: 1.5; }

  .card {
    background: var(--paper-card); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 1px 0 rgba(20,24,31,0.03), 0 12px 28px -18px rgba(20,24,31,0.35); overflow: hidden;
  }
  .context {
    padding: 16px 20px; border-bottom: 1px dashed var(--line); font-size: 13px; color: var(--ink-soft);
  }
  .context strong { color: var(--ink); }
  .context .row { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .context .row:last-child { margin-bottom: 0; }

  form { padding: 22px 20px 20px; }
  legend { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--amber-deep); margin-bottom: 12px; }

  .status-options { display: flex; flex-direction: column; gap: 8px; }
  .status-option {
    display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 8px;
    padding: 14px; cursor: pointer; background: #fff; transition: all 0.15s ease;
  }
  .status-option input { accent-color: var(--amber); width: 16px; height: 16px; }
  .status-option.selected { border-color: var(--amber); background: rgba(200,121,31,0.06); }
  .status-option.selected[data-value="Incomplete"] { border-color: var(--error); background: rgba(184,66,47,0.06); }
  .status-option .label { font-weight: 600; font-size: 14px; }
  .status-option .desc { font-size: 12px; color: var(--ink-soft); }

  .submit-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-top: 22px; padding-top: 18px; border-top: 1px dashed var(--line);
  }
  button {
    font-family: var(--sans); font-weight: 600; font-size: 15px; color: #fff; background: var(--ink);
    border: none; border-radius: 7px; padding: 12px 22px; cursor: pointer;
  }
  button:hover { background: var(--ink-soft); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  .status-note { font-size: 12px; color: var(--ink-soft); font-family: var(--mono); }

  .result { display: none; padding: 24px 20px; }
  .result.show { display: block; }
  .card.hide-form form, .card.hide-form .context { display: none; }
  .result-icon {
    width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 20px; margin-bottom: 14px;
  }
  .result.ok .result-icon { background: rgba(47,122,79,0.12); color: var(--ok); }
  .result.err .result-icon { background: rgba(184,66,47,0.12); color: var(--error); }
  .result h2 { font-size: 19px; margin: 0 0 8px; }
  .result p { font-size: 14px; color: var(--ink-soft); line-height: 1.55; margin: 0; }

  .missing-link {
    padding: 30px 20px; text-align: center; color: var(--ink-soft); font-size: 14px;
  }
</style>
</head>
<body>

<div class="sheet">
  <div class="hero">
    <div class="eyebrow">Property Maintenance</div>
    <h1>Visit Status</h1>
    <p class="sub">Let us know how the job went.</p>
  </div>

  <div class="card" id="card">
    <div class="context" id="context"></div>

    <form id="statusForm" novalidate>
      <legend>Job status</legend>
      <div class="status-options">
        <label class="status-option" for="status-completed" data-value="Completed">
          <input type="radio" id="status-completed" name="work_status" value="Completed" required>
          <div><div class="label">Completed</div><div class="desc">The job is fully finished.</div></div>
        </label>
        <label class="status-option" for="status-incomplete" data-value="Incomplete">
          <input type="radio" id="status-incomplete" name="work_status" value="Incomplete">
          <div><div class="label">Incomplete</div><div class="desc">Still in progress — we'll check back with you again shortly.</div></div>
        </label>
      </div>

      <div class="submit-row">
        <span class="status-note" id="statusNote">&nbsp;</span>
        <button type="submit" id="submitBtn">Submit status</button>
      </div>
    </form>

    <div class="result" id="result">
      <div class="result-icon" id="resultIcon">✓</div>
      <h2 id="resultTitle">Status submitted</h2>
      <p id="resultBody">Thanks — the workflow will continue automatically.</p>
    </div>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const resumeUrl = params.get('resumeUrl');

  const card = document.getElementById('card');
  const context = document.getElementById('context');
  const form = document.getElementById('statusForm');
  const result = document.getElementById('result');
  const resultIcon = document.getElementById('resultIcon');
  const resultTitle = document.getElementById('resultTitle');
  const resultBody = document.getElementById('resultBody');
  const submitBtn = document.getElementById('submitBtn');
  const statusNote = document.getElementById('statusNote');

  if (!resumeUrl) {
    card.innerHTML = '<div class="missing-link">This link is missing required information. Please use the link from your email.</div>';
  } else {
    const fields = [
      ['Request ID', params.get('request_id')],
      ['Tenant', params.get('tenant_name')],
      ['Unit', params.get('unit')]
    ];
    context.innerHTML = fields
      .filter(([, v]) => v)
      .map(([label, v]) => `<div class="row"><span>${label}</span><strong>${v}</strong></div>`)
      .join('');

    form.addEventListener('change', function (e) {
      if (e.target.name !== 'work_status') return;
      document.querySelectorAll('.status-option').forEach(el => el.classList.remove('selected'));
      e.target.closest('.status-option').classList.add('selected');
    });

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      const payload = { work_status: form.work_status.value };

      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting…";
      statusNote.textContent = "Sending status…";

      try {
        const res = await fetch(resumeUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error("Request failed with status " + res.status);

        card.classList.add('hide-form');
        result.classList.add('show', 'ok');
        resultIcon.textContent = "✓";
        resultTitle.textContent = "Status submitted";
        resultBody.textContent = payload.work_status === 'Completed'
          ? "Thanks — the tenant will be asked for feedback shortly."
          : "Thanks — we'll check back with you again in a couple of hours.";
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit status";
        statusNote.textContent = "Something went wrong — please try again.";
        card.classList.add('hide-form');
        result.classList.add('show', 'err');
        resultIcon.textContent = "!";
        resultTitle.textContent = "Couldn't submit your status";
        resultBody.textContent = "There was a problem reaching the workflow. Please try the link again, or contact the office directly.";
      }
    });
  }
</script>

</body>
</html>
